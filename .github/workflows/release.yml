name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_notarization:
        description: 'Skip notarization step'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

env:
  XCODE_VERSION: '16.0'

jobs:
  build-release:
    name: Build Release
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Get Version
        id: version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            # Extract version from tag (e.g., v1.0.0 -> 1.0.0)
            VERSION="${GITHUB_REF_NAME#v}"
            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=dev-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject Team ID into ExportOptions
        if: env.APPLE_TEAM_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/g" ExportOptions.plist
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/g" ExportOptions-AppStore.plist

      - name: Build Release Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          TEAM_FLAG=""
          SIGNING_FLAG="CODE_SIGNING_ALLOWED=NO"
          if [ -n "$APPLE_TEAM_ID" ]; then
            TEAM_FLAG="DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
            SIGNING_FLAG=""
          fi
          xcodebuild archive \
            -scheme PasteShelf \
            -configuration Release \
            -archivePath build/PasteShelf.xcarchive \
            $SIGNING_FLAG $TEAM_FLAG

      - name: Export App
        run: |
          xcodebuild -exportArchive \
            -archivePath build/PasteShelf.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist || {
              # Fallback: Copy app from archive if export fails
              mkdir -p build/export
              cp -R build/PasteShelf.xcarchive/Products/Applications/PasteShelf.app build/export/
            }

      # Code Signing step - Enable when Apple Developer credentials are configured
      # Required secrets: APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_KEYCHAIN_PASSWORD
      # - name: Import Code Signing Certificate
