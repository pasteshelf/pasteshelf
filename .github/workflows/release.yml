name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Release
        run: |
          xcodebuild archive \
            -scheme PasteShelf \
            -configuration Release \
            -archivePath build/PasteShelf.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export App
        run: |
          xcodebuild -exportArchive \
            -archivePath build/PasteShelf.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist || true

      - name: Create DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -d "build/export/PasteShelf.app" ]; then
            hdiutil create -volname "PasteShelf" \
              -srcfolder build/export/PasteShelf.app \
              -ov -format UDZO \
              "build/PasteShelf-${APP_VERSION}.dmg"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            build/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
