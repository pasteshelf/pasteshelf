      #     # Import certificate
      #     echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
      #     security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      #
      #     # Add to search list
      #     security list-keychains -d user -s build.keychain login.keychain
      #
      # - name: Sign App
      #   env:
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     codesign --force --deep --sign "Developer ID Application: PasteShelf ($APPLE_TEAM_ID)" \
      #       --options runtime \
      #       build/export/PasteShelf.app

      # Notarization step - Enable when Apple credentials are configured
      # Required secrets: APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID
      # - name: Notarize App
      #   if: ${{ inputs.skip_notarization != 'true' }}
      #   env:
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     # Create zip for notarization
      #     ditto -c -k --keepParent build/export/PasteShelf.app build/PasteShelf-notarize.zip
      #
      #     # Submit for notarization
      #     xcrun notarytool submit build/PasteShelf-notarize.zip \
      #       --apple-id "$APPLE_ID" \
      #       --password "$APPLE_APP_PASSWORD" \
      #       --team-id "$APPLE_TEAM_ID" \
      #       --wait
      #
      #     # Staple the notarization ticket
      #     xcrun stapler staple build/export/PasteShelf.app

      - name: Create DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -d "build/export/PasteShelf.app" ]; then
            # Create a nice DMG with Applications symlink
            mkdir -p build/dmg-contents
            cp -R build/export/PasteShelf.app build/dmg-contents/
            ln -s /Applications build/dmg-contents/Applications

            hdiutil create -volname "PasteShelf $APP_VERSION" \
              -srcfolder build/dmg-contents \
              -ov -format UDZO \
              "build/PasteShelf-$APP_VERSION.dmg"

            echo "DMG created: PasteShelf-$APP_VERSION.dmg"
          else
            echo "Warning: App not found, skipping DMG creation"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/*.dmg
            build/PasteShelf.xcarchive
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            build/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

